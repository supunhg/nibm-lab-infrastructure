  Automation & Media:
    tab: Workspace
    icon: mdi-play-circle-outline
  Storage:
    tab: Workspace
    icon: mdi-nas
  Gaming & Minecraft:
    tab: Workspace
    icon: mdi-minecraft
  Quick Links:
    tab: Workspace
    style: row
    columns: 6
  Account:
    tab: Workspace
    style: row
    columns: 6
  # --- Operations tab ---
  Infrastructure:
    tab: Operations
    style: row
    columns: 3
    icon: mdi-server-network
  Identity & Operations:
    tab: Operations
    style: row
    columns: 4
    icon: mdi-shield-key-outline
  ZeroTier Remote Access:
    tab: Operations
    style: row
    columns: 6
