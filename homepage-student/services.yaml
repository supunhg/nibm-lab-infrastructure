# Student dashboard (served at home.lab to non-admin Authentik users).
# Status comes from siteMonitor probes over the Docker network - this instance has no Docker socket.
- Study & Create:
    - Student Forum:
        href: https://forum.lab
        description: Campus discussions & announcements
        icon: flarum
        siteMonitor: http://flarum:8000
    - Forgejo:
        href: https://git.lab
        description: Your Git repositories & projects
        icon: forgejo
        siteMonitor: http://forgejo:3000/api/healthz
    - Excalidraw:
        href: https://draw.lab
        description: Whiteboard, diagrams & sketches
        icon: excalidraw
        siteMonitor: http://excalidraw:80
    - Paperless-ngx:
        href: https://docs.lab
        description: Searchable document archive (OCR)
        icon: paperless-ngx
        siteMonitor: http://paperless:8000/accounts/login/

- Tools:
    - Vaultwarden:
        href: https://vault.lab
        description: Password manager (Bitwarden apps work)
        icon: vaultwarden
        siteMonitor: http://vaultwarden:80/alive
    - IT-Tools:
        href: https://tools.lab
        description: Encoders, generators, converters
        icon: it-tools
        siteMonitor: http://it-tools:80
    - Stirling PDF:
        href: https://pdf.lab
        description: Merge, split, convert & sign PDFs
        icon: stirling-pdf
        siteMonitor: http://stirling-pdf:8080
    - n8n:
        href: https://n8n.lab
        description: Workflow automation
        icon: n8n
        siteMonitor: http://n8n:5678/healthz

- Research & AI:
    - Qdrant Vector DB:
        href: https://qdrant.lab/dashboard
        description: Vector search for AI projects (access on request)
        icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/qdrant.png
    - Qdrant API key:
        href: https://qdrant.lab/my-token
        description: Your personal key, or request access
        icon: mdi-key-chain-variant-#2dd4bf

- Media & Network:
    - Jellyfin:
        href: https://jellyfin.lab
        description: Media streaming
        icon: jellyfin
        siteMonitor: http://jellyfin:8096/health
    - Speedtest:
        href: https://speed.lab
        description: Campus internet speed history
        icon: speedtest-tracker
        siteMonitor: http://speedtest-tracker:80
